# Cabeceras de seguridad (§5.5 de task.md), en su propio archivo para poder
# incluirlas con `include` en cada location que ya trae su propio
# add_header (index.html, assets): nginx solo hereda los add_header del
# nivel padre cuando el nivel hijo no define ninguno propio — si el location
# ya tiene uno (p. ej. Cache-Control), los del server{} se pierden salvo que
# se repitan acá. Ver https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style-src necesita 'unsafe-inline' porque la UI usa style={{...}} inline
# extensivamente para sus tokens de diseño (variables CSS por tema) — los
# atributos style="" no admiten nonce/hash, solo 'unsafe-inline' los cubre.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
