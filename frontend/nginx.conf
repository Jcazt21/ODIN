# server_tokens off: no anunciar la versión exacta de nginx en el header
# Server ni en páginas de error — reduce lo que un atacante puede huellear
# sin costar nada.
server_tokens off;

server {
    # 8080 y no 80: nginx corre como usuario sin privilegios (ver Dockerfile,
    # USER nginx) y solo root puede bindear puertos <1024 dentro del
    # contenedor. El mapeo "3000:8080" en docker-compose.yml mantiene el
    # puerto visible desde el host sin cambios.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Solo cubre los locations que NO definen su propio add_header
    # (/, /api/, /healthz): nginx no hereda add_header hacia un location que
    # ya trae el suyo, así que /assets/ y /index.html repiten el include
    # explícitamente — ver security-headers.conf.
    include /etc/nginx/conf.d/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Liveness para el HEALTHCHECK del contenedor (ver Dockerfile): no pasa
    # por /api/ (no depende de que el backend esté arriba) ni por el
    # fallback de SPA de más abajo.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Los archivos de /assets/ llevan hash de contenido en el nombre (Vite):
    # una URL nunca cambia de contenido, así que se pueden cachear "para
    # siempre" sin riesgo de servir una versión vieja.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sí cambia de contenido en cada deploy (referencia los
    # nuevos nombres hasheados). Si el navegador lo cachea, tras un rebuild
    # puede seguir pidiendo assets viejos que ya no existen en la imagen y
    # el fallback de SPA (try_files) los sirve como HTML -> error de MIME
    # type y pantalla en blanco. No-cache fuerza a revalidar siempre.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
