name: CI

# Calidad de código sobre cada PR y cada push a main. No hay CD: nada se despliega.
#
# requirements.lock (ver README.md#requirementslock) es la única fuente de
# verdad para versiones/hashes. El job "backend" no instala el lock completo:
# usa requirements-ci.txt con `pip install -c requirements.lock`, que toma
# versión y hash del lock pero evita pysentimiento/spacy y lo que arrastran
# (transformers/torch, varios GB). Los tests que dependen de esos paquetes se
# saltan solos (importorskip).
#
# La auditoría de dependencias vive en audit.yml (semanal), no acá.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -c requirements.lock -r requirements-ci.txt
      # Versiones de herramientas alineadas con .pre-commit-config.yaml.
      - run: pip install ruff==0.16.1 "mypy>=1.14" "pytest>=8.3"
      # Layout src/: sin instalar el paquete local, "import odin.*" falla.
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: mypy
      # SQLite en memoria (tests/conftest.py); nunca llama a Gemini (CLAUDE.md).
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Incluye `tsc -b`: falla ante errores de tipos.
      - run: npm run build
