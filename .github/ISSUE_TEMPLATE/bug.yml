name: Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Cómo reproducirlo
      description: Pasos, URL del artículo analizado si aplica.
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Docker o local, sistema operativo, analizador usado (local / gemini / groq).
