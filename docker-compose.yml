services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odin}
      POSTGRES_DB: ${POSTGRES_DB:-odin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 en el host: evita chocar con un Postgres nativo que ya podría
      # estar escuchando en el 5432 de tu máquina. Los servicios backend/
      # scraper hablan con "db:5432" dentro de la red de Docker, así que este
      # puerto solo afecta clientes externos (TablePlus, psql, etc.).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odin} -d ${POSTGRES_DB:-odin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Límites de recursos (§5.5 de task.md): sin esto un proceso descontrolado
    # en cualquier servicio (fuga de memoria, query sin límite) puede agotar
    # la RAM del host entero y tumbar todo lo demás. Techos generosos, no
    # ajustados a punta de perfilar — el objetivo es un piso de contención,
    # no tuning de producción.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-odin}:${POSTGRES_PASSWORD:-odin}@db:5432/${POSTGRES_DB:-odin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # spaCy + pysentimiento + torch cargados en memoria de proceso (README
    # §Fondo Plasma... perdón, §Modelos): el techo más alto del stack.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      # 127.0.0.1 y no localhost: ver comentario del mismo HEALTHCHECK en
      # frontend/Dockerfile — "localhost" resuelve a ::1 dentro de la imagen
      # base de nginx y el server solo escucha en 0.0.0.0:8080.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-odin}:${POSTGRES_PASSWORD:-odin}@db:5432/${POSTGRES_DB:-odin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    command: ["odin"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

volumes:
  pgdata:
  hf_cache:
