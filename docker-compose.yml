services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odin}
      POSTGRES_DB: ${POSTGRES_DB:-odin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 en el host: evita chocar con un Postgres nativo que ya podría
      # estar escuchando en el 5432 de tu máquina. Los servicios backend/
      # scraper hablan con "db:5432" dentro de la red de Docker, así que este
      # puerto solo afecta clientes externos (TablePlus, psql, etc.).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odin} -d ${POSTGRES_DB:-odin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-odin}:${POSTGRES_PASSWORD:-odin}@db:5432/${POSTGRES_DB:-odin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-odin}:${POSTGRES_PASSWORD:-odin}@db:5432/${POSTGRES_DB:-odin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    command: ["python", "main.py"]

volumes:
  pgdata:
  hf_cache:
